<!doctype html>
<html lang="ko"><head>
<title>색종이 계단</title>
<meta name="author" content="김김김">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="game-shell.css"><link rel="stylesheet" href="main.css"><script type="module" src="main.js"></script></head>
<body><main id="game-frame"><header id="game-toolbar"><span data-game-title>끝없는 계단</span><div class="toolbar-actions"><button type="button" id="sound-toggle" aria-pressed="true">소리 켬 🔊</button><button type="button" id="pause-game" hidden>쉬기 ⏸</button></div></header><div id="stairs-stage"><canvas id="game-canvas" width="480" height="680" aria-label="게임 화면"></canvas><div id="step-controls" role="group" aria-label="계단 조작" hidden><button id="step-left" type="button" data-action="turn" aria-label="방향 전환하며 계단 오르기" aria-keyshortcuts="R"></button><button id="step-right" type="button" data-action="climb" aria-label="계단 오르기" aria-keyshortcuts="I"></button></div></div>
<section id="round-overlay"><div class="round-sheet lobby-sheet">
<div class="lobby-top">
  <div class="lobby-badge best"><span class="lobby-badge-label">BEST</span><strong id="best-stat">0</strong></div>
  <div class="lobby-badge coin"><span class="lobby-badge-label">COIN</span><strong id="coin-stat">0</strong></div>
</div>
<div class="lobby-hero">
  <p class="lobby-kicker">INFINITE STAIRS</p>
  <h1 id="round-heading" data-game-title>끝없는 계단</h1>
  <p id="record-line" class="lobby-record"></p>
</div>
<p id="round-description" class="lobby-desc"></p>
<p id="game-help" class="lobby-desc"></p>
<div id="lobby-panels">
  <div id="panel-modes" class="lobby-panel" hidden>
    <h2 class="shop-title">모드 고르기</h2>
    <div class="mode-grid">
      <button type="button" class="mode-card selected" data-mode="normal"><span class="mode-icon">🏃</span><strong>일반 모드</strong><small>끝까지 높이 올라가기</small></button>
      <button type="button" class="mode-card" data-mode="practice"><span class="mode-icon">🎯</span><strong>연습 모드</strong><small>시간 안 줄어요 · 기록 안 셈</small></button>
      <button type="button" class="mode-card" data-mode="mission" disabled><span class="mode-icon">⭐</span><strong>미션</strong><small>곧 열려요</small></button>
      <button type="button" class="mode-card" data-mode="versus" disabled><span class="mode-icon">⚔️</span><strong>대결</strong><small>곧 열려요</small></button>
    </div>
  </div>
  <div id="shop" class="shop lobby-panel" hidden>
    <h2 class="shop-title">캐릭터 고르기</h2>
    <div id="hero-list" class="chip-row"></div>
    <h2 class="shop-title">함께 오르는 친구</h2>
    <div id="pet-list" class="chip-row"></div>
  </div>
  <div id="panel-records" class="lobby-panel" hidden>
    <h2 class="shop-title">내 기록</h2>
    <ul class="record-list">
      <li><span>최고 계단</span><strong id="record-best">0</strong></li>
      <li><span>모은 코인</span><strong id="record-coins">0</strong></li>
      <li><span>조작</span><strong>R 방향 · I 오르기</strong></li>
    </ul>
  </div>
  <div id="panel-settings" class="lobby-panel" hidden>
    <h2 class="shop-title">설정 · 조작법</h2>
    <p id="settings-help" class="settings-copy"></p>
    <button type="button" id="lobby-sound" class="lobby-side-btn">소리 켜기/끄기</button>
  </div>
</div>
<nav id="lobby-dock" class="lobby-dock" aria-label="로비 메뉴">
  <button type="button" class="dock-btn" data-panel="modes"><span>🎮</span>모드</button>
  <button type="button" class="dock-btn" data-panel="shop"><span>🧍</span>캐릭터</button>
  <button type="button" class="dock-btn" data-panel="records"><span>🏆</span>기록</button>
  <button type="button" class="dock-btn" data-panel="settings"><span>⚙️</span>설정</button>
  <button id="round-primary" type="button" class="play-btn">▶ 시작</button>
  <button id="round-restart" type="button" class="dock-restart" hidden>처음부터</button>
</nav>
<div class="platform-row"><span id="game-credit"></span><button id="install-app" type="button">내 기기에 아이콘 추가</button><span id="offline-status" role="status"></span><button id="update-game" type="button" hidden>새 버전 적용</button></div>
</div></section></main>
<dialog id="install-help" aria-labelledby="install-help-title"><h2 id="install-help-title">게임 아이콘 추가하기</h2><p id="install-instructions">이 화면은 기본 게임 미리보기야. 나만의 게임을 완성하고 공개하면 내 기기에 아이콘을 추가할 수 있어!</p><button id="close-install-help" type="button">닫기</button></dialog>
<script defer src="game-install.js"></script>


<script defer src="pwa.js"></script>
</body></html>
