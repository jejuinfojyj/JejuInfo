    <button id="btn-sound" class="hud-btn" title="소리">🔊</button>
  </header>

  <div id="goal"><b>🎯 할 일</b><span id="goal-text"></span></div>
  <div id="held-info" class="hidden"></div>

  </nav>

  <div id="keys-hint">⌨️ <b>WASD</b> 이동 · 🖱️ <b>화면 클릭</b> 후 마우스로 둘러보기 (<b>Esc</b> 마우스 풀기) · <b>E</b>/클릭 행동 · <b>Q</b> 상자 내려놓기</div>

  <div id="modal-bg" class="hidden">

        <h2 id="modal-title"></h2>
        <button id="modal-close" title="닫기">✖</button>
