<!DOCTYPE html>
<html lang="ko">
<head>
<title>돌고래를 향해서</title>
<meta name="author" content="검성검성">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="start">
  <div class="sky">
    <section id="screen-start" class="screen-start">
      <div class="hero" role="img" aria-label="달 앞을 헤엄치는 고래"></div>
      <div class="start-copy">
        <p class="eyebrow">밤하늘 퍼즐</p>
        <h1 class="game-title">돌고래를 향해서</h1>
        <p class="lede">흩어진 조각을 두 번 눌러 맞춰. 세 번 틀리면 끝.</p>
      </div>
      <button type="button" class="moon-btn" id="start-game">맞추기</button>
    </section>

    <section id="screen-play" class="screen-play" hidden>
      <header class="hud">
        <div class="reference" role="img" aria-label="맞춰야 할 고래와 달"></div>
        <div class="hud-mid">
          <p class="hud-label">기회</p>
          <div id="lives" class="lives"></div>
        </div>
        <button type="button" class="cloud-btn" id="pause-game">멈추기</button>
      </header>
      <div class="board-wrap">
        <div id="board" class="board" role="group" aria-label="고래 그림 조각"></div>
        <p id="play-status" class="play-status" role="status">조각을 누르고, 놓을 자리를 눌러</p>
      </div>
      <p class="sr-only">키보드에서는 방향키로 칸을 고르고 Enter로 자리를 바꾼다. Escape로 잠시 멈춘다.</p>
    </section>
  </div>

  <section id="screen-pause" class="veil" hidden>
    <div class="sheet">
      <h2>잠시 멈춤</h2>
      <div class="sheet-actions">
        <button type="button" class="moon-btn" id="resume-game">이어서</button>
        <button type="button" class="ghost-btn" id="restart-from-pause">다시 흩기</button>
        <button type="button" class="ghost-btn" id="sound-toggle" aria-pressed="true">소리 켜짐</button>
      </div>
    </div>
  </section>

  <section id="screen-result" class="veil" hidden>
    <div class="sheet">
      <p id="result-kicker" class="eyebrow">밤의 끝</p>
      <h2 id="result-title">고래가 달에 닿았어</h2>
      <p id="result-copy"></p>
      <button type="button" class="moon-btn" id="retry-game">다시 맞추기</button>
    </div>
  </section>

  <footer id="dock" class="dock">
    <p id="game-credit"></p>
    <p id="offline-status" role="status">오프라인 준비 전</p>
    <div class="dock-actions">
      <button type="button" id="install-app" class="ghost-btn">앱으로 담기</button>
      <button type="button" id="update-game" class="ghost-btn" hidden>새 버전 적용</button>
    </div>
  </footer>

  <dialog id="install-help" class="install-dialog">
    <p id="install-instructions"></p>
    <button type="button" id="close-install-help" class="moon-btn">닫기</button>
  </dialog>

  <script src="game.js"></script>
<script defer src="pwa.js"></script>
</body>
</html>
