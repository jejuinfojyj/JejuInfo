<!doctype html>
<html lang="ko">
<head>
<title>보글보글</title>
<meta name="author" content="정진">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05050C">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="cabinet">
    <div id="frame">
      <canvas id="screen" width="768" height="672" aria-label="보글보글 게임 화면"></canvas>

      <section id="start-screen" class="overlay" aria-label="시작 화면">
        <h1 class="logo" aria-label="보글보글">
          <span>보</span><span>글</span><span>보</span><span>글</span>
        </h1>
        <p class="tagline">BUBBLE DINO ARCADE · 100 ROUNDS</p>
        <div class="round-pick">
          <button type="button" id="round-prev" class="arrow" aria-label="이전 라운드">◀</button>
          <div class="round-label"><small>시작 라운드</small><strong id="round-value">1</strong></div>
          <button type="button" id="round-next" class="arrow" aria-label="다음 라운드">▶</button>
        </div>
        <button type="button" id="start-button" class="big">PUSH START <small>Enter</small></button>
        <dl class="keys">
          <div><dt>A D</dt><dd>이동</dd></div>
          <div><dt>W</dt><dd>점프</dd></div>
          <div><dt>S</dt><dd>내려가기</dd></div>
          <div><dt>J / Space</dt><dd>방울 쏘기</dd></div>
          <div><dt>Esc</dt><dd>일시정지</dd></div>
        </dl>
        <div class="menu-slot" data-slot="start"></div>
      </section>

      <section id="pause-screen" class="overlay hidden" aria-label="일시정지">
        <h2 class="panel-title">PAUSE</h2>
        <div class="menu-list">
          <button type="button" id="resume-button" class="big">계속하기</button>
          <button type="button" id="restart-button">처음부터</button>
          <button type="button" id="sound-button">소리 켜짐</button>
          <button type="button" id="title-button">타이틀로</button>
        </div>
        <div class="menu-slot" data-slot="pause"></div>
      </section>

      <section id="result-screen" class="overlay hidden" aria-label="결과">
        <h2 id="result-title" class="panel-title">GAME OVER</h2>
        <p id="result-line" class="result-line"></p>
        <dl class="score-table">
          <div><dt>SCORE</dt><dd id="result-score">0</dd></div>
          <div><dt>HI-SCORE</dt><dd id="result-hi">0</dd></div>
          <div><dt>ROUND</dt><dd id="result-round">1</dd></div>
        </dl>
        <div class="menu-list">
          <button type="button" id="again-button" class="big">다시 하기 <small>Enter</small></button>
          <button type="button" id="result-title-button">타이틀로</button>
        </div>
      </section>

      <div id="menu-extra">
        <div class="extra-row">
          <button type="button" id="install-app">앱으로 추가</button>
          <span id="offline-status" role="status">오프라인 준비 중</span>
          <button type="button" id="update-game" hidden>새 버전 적용</button>
        </div>
        <p id="game-credit" class="credit">기획·디자인: 정진</p>
      </div>
    </div>

    <div id="touch-pad" aria-hidden="true">
      <div class="pad-left">
        <button type="button" data-key="left">◀</button>
        <button type="button" data-key="down">▼</button>
        <button type="button" data-key="right">▶</button>
      </div>
      <div class="pad-right">
        <button type="button" data-key="jump" class="jump">점프</button>
        <button type="button" data-key="shoot" class="shoot">방울</button>
      </div>
    </div>
  </main>

  <dialog id="install-help">
    <h2>앱으로 추가하기</h2>
    <p id="install-instructions">브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 선택하세요.</p>
    <button type="button" id="close-install-help">닫기</button>
  </dialog>

  <script src="sprites.js"></script>
  <script src="game.js"></script>
<script defer src="pwa.js"></script>
</body>
</html>
