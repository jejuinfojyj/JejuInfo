<!DOCTYPE html>
<html lang="ko">
<head>
<title>기타루맨</title>
<meta name="author" content="김동균">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="start">
  <div class="stage" aria-hidden="true">
    <div class="spot"></div>
    <div class="curtain left"></div>
    <div class="curtain right"></div>
  </div>

  <section id="screen-start" class="screen start">
    <img class="hero-guitar" src="assets/guitar.svg" alt="" width="140" height="200">
    <div class="start-copy">
      <p class="eyebrow">무대 아케이드</p>
      <h1 class="game-title">기타루맨</h1>
      <p class="lede">떨어지는 음표에 맞춰 4개 건반을 눌러!</p>
    </div>
    <button type="button" class="amp-btn" id="start-game">연주 시작</button>
    <p class="hint desktop-only">키보드 D F · J K</p>
  </section>

  <section id="screen-play" class="screen play" hidden>
    <header class="hud">
      <div class="hud-block">
        <span class="hud-label">점수</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud-block combo-block">
        <span class="hud-label">콤보</span>
        <strong id="combo">0</strong>
      </div>
      <div class="hud-block">
        <span class="hud-label">텐션</span>
        <div class="life-bar" aria-label="남은 텐션">
          <div id="life-fill" class="life-fill"></div>
        </div>
      </div>
      <button type="button" class="icon-btn" id="pause-game" aria-label="일시정지">Ⅱ</button>
    </header>

    <div class="playfield" id="playfield">
      <img class="side-guitar" src="assets/guitar.svg" alt="" width="72" height="104">
      <div class="lanes" id="lanes"></div>
      <div class="hit-line" id="hit-line"></div>
      <div id="judge-pop" class="judge-pop" aria-live="polite"></div>
      <div class="keys" id="keys" role="group" aria-label="기타 건반 4개"></div>
    </div>
  </section>

  <section id="screen-pause" class="veil" hidden>
    <div class="sheet amp-sheet">
      <h2>잠시 멈춤</h2>
      <div class="sheet-actions">
        <button type="button" class="amp-btn" id="resume-game">이어서</button>
        <button type="button" class="ghost-btn" id="restart-from-pause">다시 연주</button>
        <button type="button" class="ghost-btn" id="sound-toggle" aria-pressed="true">소리 켜짐</button>
      </div>
      <p id="game-credit" class="credit-inline"></p>
      <p id="offline-status" class="credit-inline" role="status">오프라인 준비 전</p>
      <div class="sheet-actions row">
        <button type="button" id="install-app" class="ghost-btn">앱으로 담기</button>
        <button type="button" id="update-game" class="ghost-btn" hidden>새 버전 적용</button>
      </div>
    </div>
  </section>

  <section id="screen-result" class="veil" hidden>
    <div class="sheet amp-sheet">
      <p class="eyebrow" id="result-kicker">공연 끝</p>
      <h2 id="result-title">멋진 연주!</h2>
      <p id="result-copy"></p>
      <button type="button" class="amp-btn" id="retry-game">다시 연주하기</button>
    </div>
  </section>

  <dialog id="install-help" class="install-dialog">
    <p id="install-instructions"></p>
    <button type="button" id="close-install-help" class="amp-btn">닫기</button>
  </dialog>

  <script src="game.js"></script>
<script defer src="pwa.js"></script>
</body>
</html>
