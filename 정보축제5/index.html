<!doctype html>
<html lang="ko">
  <head>
<title>타임키퍼</title>
<meta name="author" content="정보축제">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="festival-options.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    
    <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="festival-platform.css">
</head>
  <body data-festival-game="타임키퍼">
    <div id="game-root">
      <canvas id="screen" width="480" height="270" tabindex="0" aria-label="CHRONO GEAR 게임 화면"></canvas>

      <div id="hud" class="hidden">
        <div id="hud-left">
          <div id="hud-hp"></div>
          <div id="hud-energy"><div id="hud-energy-fill"></div><span>CHRONO</span></div>
          <div id="hud-freeze" class="hidden"><span class="fz-icon"></span><span class="fz-label">시간 정지</span><span class="fz-key"></span></div>
        </div>
        <div id="hud-center">
          <div id="hud-progress"></div>
          <div id="hud-shards"></div>
        </div>
        <div id="hud-right">
          <div id="hud-era">
            <div class="era-cell" id="era-past"><b>과거</b><kbd>Q</kbd></div>
            <div class="era-cell active" id="era-present"><b>현재</b><kbd>·</kbd></div>
            <div class="era-cell" id="era-future"><b>미래</b><kbd>E</kbd></div>
          </div>
        </div>
        <div id="narration"></div>
        <div id="toast"></div>
        <div id="interact-tip"></div>
        <div id="hud-prompt"></div>
      </div>

      <div id="fade"></div>
      <div id="menu-layer"></div>
      <div id="boot-msg">시간을 감는 중…</div>
    </div>

    <noscript>이 게임을 실행하려면 JavaScript가 필요합니다.</noscript>

    <script src="src/config.js"></script>
    <script src="src/core/util.js"></script>
    <script src="src/core/keybinds.js"></script>
    <script src="src/core/input.js"></script>
    <script src="src/core/audio.js"></script>
    <script src="src/core/save.js"></script>
    <script src="src/gfx/pixel.js"></script>
    <script src="src/gfx/sprites.js"></script>
    <script src="src/gfx/particles.js"></script>
    <script src="src/gfx/effects.js"></script>
    <script src="src/gfx/background.js"></script>
    <script src="src/world/physics.js"></script>
    <script src="src/world/timeline.js"></script>
    <script src="src/world/camera.js"></script>
    <script src="src/world/objects.js"></script>
    <script src="src/world/fallers.js"></script>
    <script src="src/world/level.js"></script>
    <script src="src/data/stage1.js"></script>
    <script src="src/data/stage2.js"></script>
    <script src="src/entities/player.js"></script>
    <script src="src/entities/enemies.js"></script>
    <script src="src/ui/hud.js"></script>
    <script src="src/ui/menu.js"></script>
    <script src="src/game.js"></script>
    <script src="src/main.js"></script>
  <button id="festival-launcher" type="button" aria-label="앱 설치와 게임 정보">⋮</button><dialog id="festival-panel"><button class="festival-close" aria-label="닫기">×</button><h2></h2><p id="game-credit"></p><button id="install-app" type="button">내 기기에 아이콘 추가</button><p id="offline-status">앱 파일 준비 중…</p><button id="update-game" type="button" hidden>새 버전으로 업데이트</button><p class="festival-online-note"></p></dialog><dialog id="install-help"><h2>내 기기에 아이콘 추가</h2><p id="install-instructions"></p><button id="close-install-help" type="button">확인</button></dialog>
<script defer src="festival-platform.js"></script>
<script defer src="game-install.js"></script>
<script defer src="pwa.js"></script>
</body>
</html>
