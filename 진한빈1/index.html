<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>길동의 햄버거집</title>
  <link rel="stylesheet" href="game.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#211b40" />
</head>
<body>
  <header><strong id="title">게임</strong><span id="score" role="status"></span><span id="extra"></span><button id="pause" disabled>일시 정지</button><button id="install-app" type="button">앱 추가하기</button></header>
  <main>
    <canvas id="view" width="960" height="540" aria-label="게임 화면"></canvas>
    <div id="overlay"><div class="card"><h1 id="overlay-title"></h1><p id="overlay-text"></p><button id="action" type="button">시작하기</button></div></div>
  </main>
  <div id="controls">
    <div id="joystick" role="group" aria-label="이동 조이스틱"><span></span></div>
    <div id="choices"></div>
    <div id="touch">
      <button type="button" data-act="left">왼쪽</button><button type="button" data-act="up">위</button>
      <button type="button" data-act="down">아래</button><button type="button" data-act="right">오른쪽</button>
      <button type="button" data-act="action">행동</button>
    </div>
  </div>
  <p id="hint"></p><footer><span id="credit"></span><span id="offline-status" role="status">오프라인 저장 중…</span><button id="update-game" type="button" hidden>새 버전으로 다시 시작</button></footer>
  <dialog id="install-help"><h2>앱 추가하기</h2><p id="install-instructions"></p><button id="close-install-help" type="button">닫기</button></dialog>
  <script src="template.meta.js"></script><script src="game.config.js"></script><script src="engine.js"></script><script src="game.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
