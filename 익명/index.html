<!DOCTYPE html>
<html lang="ko">
<head>
<title>왁져 레스토랑</title>
<meta name="author" content="익명">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" data-mode="start">
    <canvas id="view" aria-label="우주 음식점 카운터. 숫자로 음식을 만든 뒤 손님에게 끌어 건넵니다."></canvas>
    <p id="live" class="sr-only" aria-live="polite"></p>

    <div id="play-hud" hidden>
      <p id="hud-time">60초</p>
      <p id="hud-score">0개</p>
      <p id="hint">같은 숫자를 세 번 눌러</p>
      <button id="pause-btn" type="button">쉬기</button>
    </div>

    <section id="panel-start">
      <h1>왁져 레스토랑</h1>
      <p class="lead">숫자를 세 번 눌러 만들고, 끌어 건네</p>
      <button id="start-btn" class="primary" type="button">영업 시작</button>
    </section>

    <section id="panel-pause" class="veil" hidden>
      <div class="slip">
        <h2>잠시 문 닫음</h2>
        <button id="resume-btn" class="primary" type="button">계속 영업</button>
        <button id="restart-btn" class="ghost" type="button">처음부터</button>
        <button id="sound-btn" class="ghost" type="button" aria-pressed="true">소리 끄기</button>
      </div>
    </section>

    <section id="panel-result" class="veil" hidden>
      <div class="slip">
        <h2>영업 끝</h2>
        <p id="result-text"></p>
        <button id="again-btn" class="primary" type="button">다시 영업</button>
      </div>
    </section>

    <div id="keypad" hidden>
      <button id="cook-0" class="cook-key" type="button" data-cook="0"><b>1</b><small>은하 젤리</small></button>
      <button id="cook-1" class="cook-key" type="button" data-cook="1"><b>2</b><small>운석 꼬치</small></button>
      <button id="cook-2" class="cook-key" type="button" data-cook="2"><b>3</b><small>달빛 수프</small></button>
    </div>

    <div id="dock">
      <button id="install-app" type="button">앱으로 담기</button>
      <p id="offline-status" role="status">오프라인 준비 전</p>
      <button id="update-game" type="button" hidden>새 버전 적용</button>
      <p id="game-credit"></p>
    </div>
  </main>

  <dialog id="install-help">
    <p id="install-instructions"></p>
    <button id="close-install-help" class="primary" type="button">닫기</button>
  </dialog>
  <div id="safe-probe" aria-hidden="true"></div>
  <script src="game.js"></script>
<script defer src="pwa.js"></script>
</body>
</html>
