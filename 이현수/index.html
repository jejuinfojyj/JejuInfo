<!doctype html>
<html lang="ko">
  <head>
<title>오벌 드리프트</title>
<meta name="author" content="이현수">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header class="topbar">
      <strong class="title" data-game-title>오벌 드리프트</strong>
      <div class="actions">
        <button type="button" data-tap="Enter">시작</button>
        <button type="button" data-tap="Escape">쉬기</button>
        <button type="button" data-tap="KeyR">다시</button>
        <button type="button" data-tap="KeyL">처음으로</button>
      </div>
      <div class="platform">
        <span id="game-credit"></span>
        <button id="install-app" type="button">내 기기에 아이콘 추가</button>
        <span id="offline-status" role="status"></span>
        <button id="update-game" type="button" hidden>새 버전 적용</button>
      </div>
    </header>
    <div class="stage">
      <canvas id="game" tabindex="0" aria-label="오벌 드리프트 서킷"></canvas>
    </div>
    <div class="touchbar" aria-label="손가락 조작">
      <button type="button" data-hold="ArrowLeft">왼쪽</button>
      <button type="button" data-hold="ArrowRight">오른쪽</button>
      <button type="button" data-hold="ArrowDown">브레이크</button>
      <button type="button" class="accel" data-hold="ArrowUp">가속</button>
      <button type="button" class="drift" data-hold="Space">드리프트</button>
    </div>
    <dialog id="install-help" aria-labelledby="install-help-title">
      <h2 id="install-help-title">게임 아이콘 추가하기</h2>
      <p id="install-instructions">공개된 게임 주소에서 기기에 아이콘을 추가할 수 있어.</p>
      <button id="close-install-help" type="button">닫기</button>
    </dialog>
    <script type="module" src="shell.js"></script>
    <script type="module" src="src/main.js"></script>
  <script defer src="game-install.js"></script>
<script defer src="pwa.js"></script>
</body>
</html>
