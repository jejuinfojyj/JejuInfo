<!doctype html>
<html lang="ko">
<head>
<title>젬 브롤</title>
<meta name="author" content="조민준">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  
  <link rel="stylesheet" href="game-shell.css" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <main id="game-frame">
    <header id="game-toolbar">
      <span data-game-title>젬 브롤</span>
      <button type="button" id="pause-game" hidden>쉬기 ⏸</button>
    </header>
    <canvas id="game-canvas" width="960" height="540" aria-label="젬 브롤 2D 가로 화면"></canvas>
    <section id="round-overlay">
      <div class="round-sheet">
        <h1 id="round-heading" data-game-title>젬 브롤</h1>
        <p id="round-description"></p>
        <p id="game-help"></p>
        <div class="round-buttons">
          <button id="round-primary" type="button">게임 시작</button>
          <button id="round-restart" type="button" hidden>처음부터</button>
        </div>
        <div class="platform-row">
          <span id="game-credit"></span>
          <button id="install-app" type="button">내 기기에 아이콘 추가</button>
          <span id="offline-status" role="status"></span>
          <button id="update-game" type="button" hidden>새 버전 적용</button>
        </div>
      </div>
    </section>
  </main>
  <dialog id="install-help" aria-labelledby="install-help-title">
    <h2 id="install-help-title">게임 아이콘 추가하기</h2>
    <p id="install-instructions">공개된 게임 주소에서 기기에 아이콘을 추가할 수 있어.</p>
    <button id="close-install-help" type="button">닫기</button>
  </dialog>
  <!-- file:// 에서도 실행되도록 번들 스크립트 사용 (ES module 아님) -->
  <script defer src="app.js"></script>
  <script defer src="game-install.js"></script>
  




<script defer src="pwa.js"></script>
</body>
</html>
