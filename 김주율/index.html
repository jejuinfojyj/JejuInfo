<!doctype html>
<html lang="ko"><head>
<title>레일서퍼</title>
<meta name="author" content="김주율">
<script src="game.config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="game-shell.css"><link rel="stylesheet" href="main.css"><script type="module" src="main.js"></script></head>
<body><main id="game-frame"><header id="game-toolbar"><span data-game-title>레일 서퍼</span><div class="toolbar-actions"><button type="button" id="sound-toggle" aria-pressed="true">소리 켬 🔊</button><button type="button" id="pause-game" hidden>쉬기 ⏸</button></div></header><canvas id="game-canvas" width="480" height="800" aria-label="게임 화면"></canvas>
<section id="round-overlay"><div class="round-sheet"><h1 id="round-heading" data-game-title>레일 서퍼</h1><p id="round-description"></p><p id="game-help"></p><p id="record-line"></p><div id="shop" class="shop"><h2 class="shop-title">달릴 친구</h2><div id="hero-list" class="chip-row"></div><h2 class="shop-title">호버보드</h2><div id="board-list" class="chip-row"></div></div><div class="round-buttons"><button id="round-primary" type="button">게임 시작</button><button id="round-restart" type="button" hidden>처음부터</button></div><div class="platform-row"><span id="game-credit"></span><button id="install-app" type="button">내 기기에 아이콘 추가</button><span id="offline-status" role="status"></span><button id="update-game" type="button" hidden>새 버전 적용</button></div></div></section></main>
<dialog id="install-help" aria-labelledby="install-help-title"><h2 id="install-help-title">게임 아이콘 추가하기</h2><p id="install-instructions">이 화면은 기본 게임 미리보기야. 나만의 게임을 완성하고 공개하면 내 기기에 아이콘을 추가할 수 있어!</p><button id="close-install-help" type="button">닫기</button></dialog>
<script defer src="game-install.js"></script>

<script defer src="pwa.js"></script>
</body></html>
